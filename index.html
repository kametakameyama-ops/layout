input[type=number]{width:64px}
button:disabled{opacity:.4}

#lp{overflow:hidden}.tp{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px}

.ol{display:flex;flex-direction:column;gap:2px}
.oi{display:flex;align-items:center;gap:1px;padding:0 2px;border:1px solid transparent;border-radius:6px}
.oi.on{background:rgba(37,99,235,.15);border-color:var(--ac)}
.oi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 3px;cursor:pointer}
.oi.h .nm{opacity:.4;text-decoration:line-through}
.oi button{padding:0;border:0;background:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;opacity:.55}
.oi button.act{color:var(--ac);opacity:1}
#mh{font-size:11px;opacity:.8}
#v{position:relative;min-height:0;background:#fff}
#v canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#fr{position:absolute;inset:0;pointer-events:none}
#md{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:9;gap:8px}
